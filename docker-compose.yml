# `models/` and `data/` are bind-mounted, never baked into an image -
# train once (profile-gated, one-off), then bring up api/dashboard
# against the resulting artifacts.
#
# Usage:
#   docker compose --profile train run --rm train-two-tower
#   docker compose --profile train run --rm train-ranker
#   docker compose up api dashboard
#
# Architecture: the dashboard IS a pure HTTP client of the api
# service (see src/recommendation/ui/api_client.py / service_loader.py) -
# it never loads a model artifact or touches the mounted models/ volume
# itself. There is still no `depends_on` declared between the two
# services below, so their listing order here is only a suggested
# startup order, not an enforced one - start api before dashboard if you
# want the dashboard usable immediately rather than showing connection
# errors until api is ready.

services:
  train-two-tower:
    build:
      context: .
      target: base
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "scripts/train_two_tower.py"]
    profiles: ["train"]

  train-ranker:
    build:
      context: .
      target: base
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: ["python", "scripts/train_ranker.py"]
    profiles: ["train"]

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      # Read-write (not :ro): the product-embedding cache
      # (data/processed/product_embeddings.npz, content-hash validated)
      # is written here on first startup and reused on restart, avoiding
      # a full Sentence Transformer re-encode of the catalog every time.
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - "8501:8501"
    volumes:
      # Vestigial since the HTTP-client rewiring: the dashboard
      # never loads a model artifact and never reads/writes the
      # embedding cache itself (all of that lives in the api container
      # now) - kept mounted only for parity with the api service's
      # compose block above, not because this container uses them.
      - ./models:/app/models:ro
      - ./data:/app/data
    restart: unless-stopped
