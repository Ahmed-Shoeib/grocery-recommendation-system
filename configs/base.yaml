# Base configuration for the grocery recommendation system.
# Every hyperparameter / path / threshold that later phases would otherwise
# hard-code lives here so behavior can change without touching code.
# Loaded by src/recommendation/utils/config.py into a typed AppConfig.
#
# Which file loads: RECS_CONFIG_PATH env var (defaults to this file).
# Individual settings can then be overridden on top, without editing any
# YAML file - useful for containers/deployment (Phase 10):
#   RECS_MODELS_DIR              -> paths.models_dir
#   RECS_LOG_LEVEL                -> log_level
#   RECS_RETRIEVAL_BACKEND        -> retrieval.backend ("faiss" | "scann")
#   RECS_API_HOST / RECS_API_PORT -> api.host / api.port
#   RECS_API_DEFAULT_TOP_N        -> api.default_recommendation_count
#   RECS_API_MAX_TOP_N            -> api.max_recommendation_count
# See utils/config.py: _ENV_OVERRIDES for the authoritative list.

random_seed: 42
log_level: "INFO"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_synthetic: "data/synthetic"
  models_dir: "models"
  # Backend-shaped synthetic integration dataset (see
  # scripts/generate_backend_shaped_sqlite.py) - read-only, not the live
  # serving data source in V1.
  data_sqlite: "data/sqlite/backend_shaped_synthetic.db"

# Phase 2 synthetic dataset generation.
synthetic_data:
  num_products: 50
  num_users: 300
  random_seed: 42

  incomplete_profile_fraction: 0.05
  preferred_category_alignment_prob: 0.8

  order_status_weights:
    DELIVERED: 0.65
    COMPLETED: 0.15
    CANCELLED: 0.10
    PENDING: 0.10
  order_counted_statuses: ["DELIVERED", "COMPLETED"]
  order_count_lambda: 2.5
  order_max_count: 8
  order_items_min: 1
  order_items_max: 5
  order_quantity_max: 3
  order_date_lookback_days: 180

  cart_nonempty_prob: 0.7
  cart_items_max: 6
  cart_quantity_max: 3

  review_prob: 0.35

  # Click (fifth V1 engagement signal, synthetic-only for now - see
  # docs/data-mapping.md section 4).
  click_count_lambda: 4.0
  click_max_count: 15

  search_count_lambda: 2.5
  search_max_count: 10
  search_product_term_prob: 0.7

  chatbot_context_prob: 0.4
  chatbot_mentions_max: 4

  brand_affinity_prob: 0.35
  brand_affinity_bonus: 2.0

  affinity_noise_scale: 0.4

# Phase 3: Sentence Transformer product encoding.
embedding:
  sentence_transformer_model: "all-MiniLM-L6-v2"
  embedding_dim: 384
  cache_path: "data/processed/product_embeddings.npz"
  device: "cpu"
  encode_batch_size: 32

# Phase 3: user/product feature engineering weights.
# click_weight is an unbenchmarked placeholder for the newly-added CLICK
# signal - see FeatureConfig docstring (src/recommendation/utils/config.py).
features:
  click_weight: 0.1
  purchase_weight: 0.45
  cart_weight: 0.25
  search_weight: 0.15
  chatbot_weight: 0.15
  preferred_category_weight: 0.5
  max_top_categories: 5
  max_top_brands: 5

  # Recency (time-decay) weighting - see docs/data-mapping.md section 14.
  # effective_weight = signal_weight * 0.5 ** (age_days / half_life_days).
  # half_life_days=21 (three weeks) is an initial, explicitly unbenchmarked
  # baseline for grocery's weekly/biweekly replenishment cadence - chosen
  # by inspection of the SQLite dataset's ~7-month (Jan 15 - Aug 17) event
  # span, not tuned against real usage data. Only events that actually
  # carry a real action_time (the User_events/SQLite-sourced path) are
  # ever decayed - the old timestamp-less ERD synthetic signals fall back
  # to a neutral weight (see features.recency.effective_weight).
  recency:
    enabled: true
    half_life_days: 21.0

# Phase 4: Two-Tower retrieval model.
two_tower:
  projection_dims: [256, 128]
  output_dim: 128
  learning_rate: 0.001
  batch_size: 64
  epochs: 20
  dropout_rate: 0.1
  temperature: 0.05
  category_embedding_dim: 16
  brand_embedding_dim: 16
  age_group_embedding_dim: 8
  min_distinct_products_for_holdout: 3
  eval_k_values: [5, 10, 20]
  early_stopping_patience: 3
  random_seed: 42

# Phase 5: ANN retrieval. `backend` selects the VectorIndex implementation.
# scann = primary, production-intended backend; Linux/Docker-only (no
#   Windows wheel), see configs/docker.yaml and docs/data-mapping.md
#   section 10.
# faiss = native-Windows development fallback, used by this file so local
#   dev/tests run without Docker.
retrieval:
  backend: "faiss"
  candidate_pool_multiplier: 5   # ScaNN/FAISS retrieves limit * multiplier candidates, capped by catalog size
  min_candidate_pool: 50

# Phase 7: three-level personalization / cold-start strategy.
# History strength = count of events across the five V1 engagement signals
# (clicks, purchases, cart adds, searches, chatbot context presence).
cold_start:
  strong_history_min_signals: 5
  sparse_history_min_signals: 1
  # Blend weights for SPARSE_HISTORY users; must sum to 1.0.
  sparse_blend:
    personalized: 0.6
    preferred_category: 0.2
    popularity: 0.2
  # Fallback order for NO_HISTORY users.
  no_history_fallback_order: ["preferred_category", "category_popularity", "global_popularity"]

# Phase 7/11: hard global catalog-eligibility policy, applied TWICE - as
# a pre-retrieval gate (before any candidate generation) AND as a final
# lightweight validation (see docs/data-mapping.md section 5). Only
# fields that actually exist on Product in the ERD (isActive,
# stockQuantity) are used in V1.
eligibility:
  require_active: true
  require_in_stock: true

# Phase 7: re-ranking (dedup + diversity). Continuous score-penalty
# trade-off, not a hard quota - see RerankingConfig docstring.
reranking:
  diversity_strength: 0.5
  category_repetition_penalty: 0.15
  brand_repetition_penalty: 0.08

# Phase 6: neural ranker. Consumes candidates retrieved by VectorIndex
# (Phase 5) plus richer per-candidate features than the Two-Tower model
# sees (cross features, popularity, retrieval score/rank - see
# src/recommendation/ranking/features.py).
ranking:
  hidden_units: [128, 64]
  learning_rate: 0.001
  epochs: 10
  batch_size: 256
  dropout_rate: 0.1
  negatives_per_positive: 4
  early_stopping_patience: 3
  eval_k_values: [5, 10, 20]
  random_seed: 42

# Phase 8: recommendation API. host/port overridable via RECS_API_HOST /
# RECS_API_PORT (see utils/config.py: _ENV_OVERRIDES, Phase 10) - useful
# in containers without editing this file.
api:
  model_version: "v1"
  default_recommendation_count: 10
  max_recommendation_count: 50
  host: "0.0.0.0"
  port: 8000

# Phase 9: internal dashboard. Currently unused: the dashboard reuses
# RecommendationService in-process (src/recommendation/ui/service_loader.py)
# rather than calling the API over HTTP, so a single `streamlit run` is
# enough - no separately-running API server required. Kept here in case a
# real microservice split (dashboard -> HTTP -> API) is revisited later.
dashboard:
  api_base_url: "http://localhost:8000"
