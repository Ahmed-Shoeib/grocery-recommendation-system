# Docker/Linux configuration: identical to configs/base.yaml except
# retrieval.backend (ScaNN - the primary, production-intended ANN backend,
# Phase 5; no Windows wheel, so native Windows dev keeps base.yaml/FAISS)
# and dashboard.api_base_url (STEP 9): inside Docker Compose's default
# network, "localhost" from the dashboard container's perspective is the
# dashboard container itself, not the separate api container - Compose
# makes each service reachable by its service NAME instead
# (docker-compose.yml's `api` service), so this points there.
#
# Kept as a full standalone copy of base.yaml, not a partial override -
# src/recommendation/utils/config.py loads each config file as a complete
# AppConfig, it does not merge configs. If base.yaml's tunables change,
# mirror the change here.
#
# Individual settings can be overridden on top via env vars without
# editing this file (Phase 10) - see utils/config.py: _ENV_OVERRIDES, or
# the equivalent comment block at the top of base.yaml.

random_seed: 42
log_level: "INFO"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_synthetic: "data/synthetic"
  models_dir: "models"
  data_sqlite: "data/sqlite/backend_shaped_synthetic.db"
  data_source: "sqlite"

# Phase 2 synthetic dataset generation.
synthetic_data:
  num_products: 50
  num_users: 300
  random_seed: 42

  incomplete_profile_fraction: 0.05
  preferred_category_alignment_prob: 0.8

  order_status_weights:
    DELIVERED: 0.65
    COMPLETED: 0.15
    CANCELLED: 0.10
    PENDING: 0.10
  order_counted_statuses: ["DELIVERED", "COMPLETED"]
  order_count_lambda: 2.5
  order_max_count: 8
  order_items_min: 1
  order_items_max: 5
  order_quantity_max: 3
  order_date_lookback_days: 180

  cart_nonempty_prob: 0.7
  cart_items_max: 6
  cart_quantity_max: 3

  review_prob: 0.35

  click_count_lambda: 4.0
  click_max_count: 15

  search_count_lambda: 2.5
  search_max_count: 10
  search_product_term_prob: 0.7

  chatbot_context_prob: 0.4
  chatbot_mentions_max: 4

  brand_affinity_prob: 0.35
  brand_affinity_bonus: 2.0

  affinity_noise_scale: 0.4

# Phase 3: Sentence Transformer product encoding.
embedding:
  sentence_transformer_model: "all-MiniLM-L6-v2"
  embedding_dim: 384
  cache_path: "data/processed/product_embeddings.npz"
  device: "cpu"
  encode_batch_size: 32

# Phase 3: user/product feature engineering weights.
features:
  click_weight: 0.1
  purchase_weight: 0.45
  cart_weight: 0.25
  search_weight: 0.15
  chatbot_weight: 0.15
  preferred_category_weight: 0.5
  max_top_categories: 5
  max_top_brands: 5

  # Recency (time-decay) weighting - see docs/data-mapping.md section 14
  # and the matching comment in configs/base.yaml.
  recency:
    enabled: true
    half_life_days: 21.0

# Phase 4: Two-Tower retrieval model.
two_tower:
  projection_dims: [256, 128]
  output_dim: 128
  learning_rate: 0.001
  batch_size: 64
  epochs: 20
  dropout_rate: 0.1
  temperature: 0.05
  category_embedding_dim: 16
  brand_embedding_dim: 16
  age_group_embedding_dim: 8
  price_tier_embedding_dim: 8
  min_distinct_products_for_holdout: 3
  eval_k_values: [5, 10, 20]
  early_stopping_patience: 3
  random_seed: 42

# Phase 5: ANN retrieval. ScaNN is the primary/production backend, run
# here inside Linux/Docker (see docs/data-mapping.md section 10).
retrieval:
  backend: "scann"
  candidate_pool_multiplier: 5   # ScaNN/FAISS retrieves limit * multiplier candidates, capped by catalog size
  min_candidate_pool: 50

# Phase 7: three-level personalization / cold-start strategy.
cold_start:
  strong_history_min_signals: 5
  sparse_history_min_signals: 1
  sparse_blend:
    personalized: 0.6
    preferred_category: 0.2
    popularity: 0.2
  no_history_fallback_order: ["preferred_category", "category_popularity", "global_popularity"]

# Phase 7/11: hard global catalog-eligibility policy, applied as both a
# pre-retrieval gate and a final lightweight validation (docs/data-mapping.md section 5).
eligibility:
  require_active: true
  require_in_stock: true

# Phase 7: re-ranking (dedup + diversity). Continuous score-penalty
# trade-off, not a hard quota - see RerankingConfig docstring.
reranking:
  diversity_strength: 0.5
  category_repetition_penalty: 0.15
  brand_repetition_penalty: 0.08

# Phase 6: neural ranker. Consumes candidates retrieved by VectorIndex
# (Phase 5) plus richer per-candidate features than the Two-Tower model
# sees (cross features, popularity, retrieval score/rank - see
# src/recommendation/ranking/features.py).
ranking:
  hidden_units: [128, 64]
  learning_rate: 0.001
  epochs: 10
  batch_size: 256
  dropout_rate: 0.1
  negatives_per_positive: 4
  early_stopping_patience: 3
  eval_k_values: [5, 10, 20]
  random_seed: 42

# Phase 8: recommendation API. host/port overridable via RECS_API_HOST /
# RECS_API_PORT (see utils/config.py: _ENV_OVERRIDES, Phase 10) - useful
# in containers without editing this file.
api:
  model_version: "v1"
  default_recommendation_count: 10
  max_recommendation_count: 50
  host: "0.0.0.0"
  port: 8000

# Phase 9 / STEP 9: internal dashboard. Streamlit is a pure HTTP client of
# FastAPI (docs/data-mapping.md section 18) - "api" below is the
# docker-compose.yml service name/hostname, not localhost (see this
# file's header comment).
dashboard:
  api_base_url: "http://api:8000"
  request_timeout_seconds: 10.0
