[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-recommendation-system"
version = "0.1.0"
description = "Production-oriented personalized grocery recommendation service."
requires-python = ">=3.11,<3.14"
readme = "README.md"

# Core dependencies needed from Phase 1 onward (config, schemas, data handling).
# Kept deliberately lightweight so `pip install -e .` stays fast; heavier ML/
# serving stacks are opt-in extras below and are only required starting the
# phase that actually uses them (see docs/data-mapping.md for the phase map).
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Sentence Transformer encoding + Two-Tower model (Phases 3-4).
# tensorflow-recommenders is deliberately NOT included: it still requires
# tf.keras to be Keras 2 (`_check_keras_version` raises otherwise), fixable
# only via the global TF_USE_LEGACY_KERAS=1 env var set before TensorFlow's
# first import anywhere in the process - fragile across scripts/tests/API
# import order for a dependency whose only job (in-batch softmax retrieval
# loss) is ~15 lines of plain Keras 3. See docs/data-mapping.md Phase 4 notes.
ml = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "tensorflow>=2.16,<2.22",
]
# Approximate nearest-neighbor retrieval (Phase 5). FAISS is the
# native-Windows development fallback - genuine Windows wheels, so local
# dev/tests run without Docker (see docs/data-mapping.md, section 10).
retrieval = [
    "faiss-cpu>=1.9",
]
# ScaNN (Phase 5) - the primary, production-intended ANN backend. Linux-only
# (no Windows wheel exists or is planned upstream); the `sys_platform`
# marker makes `pip install -e ".[retrieval-scann]"` a harmless no-op on
# Windows rather than a hard failure. Installed inside the Docker image
# built from the repo-root Dockerfile, never in the native Windows venv.
retrieval-scann = [
    "scann>=1.4; sys_platform == 'linux'",
]
# API + internal dashboard (Phases 8-9).
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
full = [
    "grocery-recommendation-system[ml,retrieval,serving,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
